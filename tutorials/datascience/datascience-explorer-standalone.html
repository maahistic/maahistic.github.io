  <script>
(function () {
  "use strict";
  var el = DS.el;

  /* Distribution data â€” deterministic */
  var DIST_DATA = DS.normalSeq(200, 12345).map(function (z) { return Math.round(50 + 12 * z); });

  /* Correlation data seeds */
  var COR_N = 60;
  var COR_XS = DS.normalSeq(60, 777);
  var COR_NOISE = DS.normalSeq(60, 4242);

  DS.registerTopic({
    id: "statistics",
    title: "Statistics",
    icon: "ðŸ“Š",
    subtitle: "Center, spread, correlation â€” the math behind the insights",
    order: 6,
    countable: true,
    render: function (root) {
      root.appendChild(el("h1", { text: "ðŸ“Š Statistics" }));
      root.appendChild(el("p", { class: "section-intro", text: "Statistics gives you the tools to summarize data, measure uncertainty, and test hypotheses. Here we cover the essentials: center, spread, and correlation." }));

      /* Center measures */
      root.appendChild(el("h2", { text: "Measures of center" }));
      root.appendChild(el("p", { html: "<strong>Mean</strong> â€” the arithmetic average. <strong>Median</strong> â€” the middle value when sorted. <strong>Mode</strong> â€” the most frequent value." }));
      root.appendChild(DS.callout("info", "The <strong>median</strong> is more robust to outliers. If your data is skewed (e.g., incomes), report the median."));

      /* Center & Spread Explorer */
      root.appendChild(el("h2", { text: "Center & Spread Explorer" }));

      var dataInput = el("input", { type: "text", value: "4, 8, 15, 16, 23, 42", style: { width: "100%", maxWidth: "400px" } });
      var statsRow = el("div", { class: "stat-row" });
      var numberLine = el("div", { class: "number-line", style: { height: "90px" } });
      var errorMsg = el("div", { class: "error-msg" });

      var presets = [
        { label: "Simple", data: "4, 8, 15, 16, 23, 42" },
        { label: "Symmetric", data: "10, 20, 30, 40, 50" },
        { label: "Outlier", data: "10, 32, 35, 38, 40, 900" },
        { label: "Repeats", data: "5, 5, 10, 10, 10, 15, 20" }
      ];

      function updateStats() {
        errorMsg.textContent = "";
        var raw = dataInput.value.split(",").map(function (s) { return parseFloat(s.trim()); }).filter(function (v) { return !isNaN(v); });
        if (raw.length < 2) { errorMsg.textContent = "Enter at least 2 numbers"; return; }

        var m = DS.mean(raw), med = DS.median(raw), mod = DS.mode(raw);
        var sd = DS.std(raw, false), mn = Math.min.apply(null, raw), mx = Math.max.apply(null, raw);

        statsRow.innerHTML = "";
        [
          { label: "Mean", val: DS.round(m) },
          { label: "Median", val: DS.round(med) },
          { label: "Mode", val: mod !== null ? mod : "â€”" },
          { label: "Std (sample)", val: DS.round(sd) },
          { label: "Min", val: mn },
          { label: "Max", val: mx }
        ].forEach(function (s) {
          statsRow.appendChild(el("div", { class: "stat-v" },
            el("div", { class: "s-val", text: s.val }),
            el("div", { class: "s-lab", text: s.label })
          ));
        });

        /* Number line */
        numberLine.innerHTML = "";
        var pad = 20;
        var range = mx - mn || 1;
        var track = el("div", { class: "nl-track" });
        numberLine.appendChild(track);

        // Points
        raw.forEach(function (v) {
          var pct = ((v - mn) / range) * 100;
          var p = el("div", { class: "nl-point", style: { left: "calc(" + pad + "px + " + pct + "% * (1 - " + (2 * pad) + "px / 100%))" } });
          p.style.left = (pad + pct * (1 - 2 * pad / numberLine.offsetWidth || 0.9)) + "px";
          numberLine.appendChild(p);
        });
        // Recalc with actual width after render
        setTimeout(function () {
          var w = numberLine.offsetWidth;
          var usable = w - 2 * pad;
          numberLine.querySelectorAll(".nl-point").forEach(function (pt, i) {
            var pct = (raw[i] - mn) / range;
            pt.style.left = (pad + pct * usable) + "px";
          });

          // Mean marker
          var meanPct = (m - mn) / range;
          var meanM = el("div", { class: "nl-marker", style: { left: (pad + meanPct * usable) + "px", height: "28px", top: "18%", background: "var(--brand)" } });
          numberLine.appendChild(meanM);
          numberLine.appendChild(el("div", { class: "nl-label", style: { left: (pad + meanPct * usable) + "px", color: "var(--brand)" }, text: "mean" }));

          // Median marker
          var medPct = (med - mn) / range;
          var medM = el("div", { class: "nl-marker", style: { left: (pad + medPct * usable) + "px", height: "28px", top: "18%", background: "var(--accent)" } });
          numberLine.appendChild(medM);
          numberLine.appendChild(el("div", { class: "nl-label", style: { left: (pad + medPct * usable + 20) + "px", color: "var(--accent)" }, text: "median" }));

          // Std band
          var lo = (DS.clamp(m - sd, mn, mx) - mn) / range;
          var hi = (DS.clamp(m + sd, mn, mx) - mn) / range;
          var band = el("div", { class: "nl-band", style: { left: (pad + lo * usable) + "px", width: ((hi - lo) * usable) + "px", background: "var(--brand)" } });
          numberLine.appendChild(band);
        }, 30);
      }

      var presetChips = el("div", { class: "chips" });
      presets.forEach(function (p) {
        var chip = el("span", { class: "chip", text: p.label });
        chip.addEventListener("click", function () {
          dataInput.value = p.data;
          updateStats();
        });
        presetChips.appendChild(chip);
      });

      dataInput.addEventListener("input", updateStats);

      root.appendChild(DS.widget("Center & Spread Explorer", "ðŸ“", "Interactive",
        el("div", { class: "controls" },
          el("div", { class: "control", style: { flex: "1" } }, el("label", { text: "Data (comma-separated)" }), dataInput)
        ),
        el("div", { style: { marginTop: "8px" } }, el("label", { text: "Presets: ", style: { fontSize: ".78rem", color: "var(--muted)" } }), presetChips),
        statsRow, numberLine, errorMsg
      ));
      setTimeout(updateStats, 30);

      /* Distribution Shape */
      root.appendChild(el("h2", { text: "Distribution Shape" }));
      var distCanvas = el("canvas", { style: { height: "280px", width: "100%", background: "var(--bg-elev-2)", borderRadius: "var(--radius-sm)" } });
      var distBins = 12;

      function drawDist() {
        DS.chart(distCanvas, {
          type: "hist", data: DIST_DATA, bins: distBins,
          xLabel: "Value", yLabel: "Frequency"
        });
      }

      var distSlider = el("input", { type: "range", min: "4", max: "30", value: "12" });
      var distVal = el("span", { class: "val", text: "12" });
      distSlider.addEventListener("input", function () {
        distVal.textContent = distSlider.value;
        distBins = parseInt(distSlider.value);
        drawDist();
      });

      root.appendChild(DS.widget("Distribution Shape", "ðŸ””", "Interactive",
        el("div", { class: "controls" },
          el("div", { class: "control" }, el("label", { text: "Bins" }), distSlider, distVal)
        ),
        distCanvas
      ));
      setTimeout(drawDist, 80);

      /* Correlation Explorer */
      root.appendChild(el("h2", { text: "Correlation Explorer" }));
      root.appendChild(el("p", { text: "Pearson's r measures linear association: +1 = perfect positive, 0 = none, âˆ’1 = perfect negative." }));

      var corCanvas = el("canvas", { style: { height: "300px", width: "100%", background: "var(--bg-elev-2)", borderRadius: "var(--radius-sm)" } });
      var corR = 0.7;
      var corInfo = el("div", { class: "stat-row" });

      function drawCorrelation() {
        var ys = COR_XS.map(function (x, i) {
          return corR * x + Math.sqrt(Math.max(0, 1 - corR * corR)) * COR_NOISE[i];
        });
        var measuredR = DS.pearsonR(COR_XS, ys);
        var absR = Math.abs(measuredR);
        var strength = absR > 0.8 ? "Strong" : absR > 0.5 ? "Moderate" : absR > 0.2 ? "Weak" : "Very weak / none";
        var direction = measuredR > 0.05 ? "positive" : measuredR < -0.05 ? "negative" : "none";

        corInfo.innerHTML = "";
        corInfo.appendChild(el("div", { class: "stat-v" },
          el("div", { class: "s-val", text: DS.round(measuredR) }),
          el("div", { class: "s-lab", text: "Pearson r" })
        ));
        corInfo.appendChild(el("div", { class: "stat-v" },
          el("div", { class: "s-val", text: strength }),
          el("div", { class: "s-lab", text: "Strength" })
        ));
        corInfo.appendChild(el("div", { class: "stat-v" },
          el("div", { class: "s-val", text: direction }),
          el("div", { class: "s-lab", text: "Direction" })
        ));

        // Fit line
        var fit = DS.linearFit(COR_XS, ys);
        var xsSort = COR_XS.slice().sort(function (a, b) { return a - b; });
        var lineX = [xsSort[0], xsSort[xsSort.length - 1]];
        var lineY = lineX.map(function (x) { return fit.slope * x + fit.intercept; });

        DS.chart(corCanvas, {
          type: "scatter",
          series: [
            { x: COR_XS, y: ys, label: "Data" },
            { x: lineX, y: lineY, kind: "line", label: "Fit", markers: false, color: "var(--accent)" }
          ],
          xLabel: "x", yLabel: "y"
        });
      }

      var corSlider = el("input", { type: "range", min: "-100", max: "100", value: "70", style: { width: "260px" } });
      var corSliderVal = el("span", { class: "val", text: "0.70" });
      corSlider.addEventListener("input", function () {
        corR = parseInt(corSlider.value) / 100;
        corSliderVal.textContent = corR.toFixed(2);
        drawCorrelation();
      });

      root.appendChild(DS.widget("Correlation Explorer", "ðŸ”—", "Interactive",
        el("div", { class: "controls" },
          el("div", { class: "control" }, el("label", { text: "Target r" }), corSlider, corSliderVal)
        ),
        corCanvas, corInfo
      ));
      setTimeout(drawCorrelation, 100);

      root.appendChild(DS.callout("warn", "âš ï¸ <strong>Correlation â‰  causation.</strong> Ice cream sales and drowning are correlated â€” but ice cream doesn't cause drowning. The hidden variable is summer heat."));

      /* Quiz */
      root.appendChild(el("h2", { text: "Check your understanding" }));
      root.appendChild(DS.quiz({
        title: "Statistics Quiz",
        questions: [
          {
            q: "Which measure of center is most appropriate for skewed data?",
            options: ["Mean", "Median", "Mode", "Range"],
            answer: 1,
            explain: "The median is robust to outliers and skew, making it more representative of the 'typical' value."
          },
          {
            q: "A large standard deviation means the data is:",
            options: ["Clustered near the mean", "Widely spread out", "Normally distributed", "Skewed left"],
            answer: 1,
            explain: "Standard deviation measures spread. A large value means data points are far from the mean on average."
          },
          {
            q: "What does r = âˆ’0.9 indicate?",
            options: ["No relationship", "Weak positive correlation", "Strong negative correlation", "Causation"],
            answer: 2,
            explain: "|r| = 0.9 is very strong. The negative sign means as x increases, y decreases."
          },
          {
            q: "Correlation does NOT imply:",
            options: ["Association", "Linear relationship", "Causation", "Co-movement"],
            answer: 2,
            explain: "Correlation measures association, but cannot prove that one variable causes changes in another."
          }
        ]
      }));

      root.appendChild(DS.doneToggle("statistics"));
      root.appendChild(DS.pageNav("statistics"));
    }
  });
})();

  <script>
(function () {
  "use strict";
  var el = DS.el;

  /* Generate tips data with seeded RNG */
  var R = DS.mulberry32(20240815);
  var TIPS = [];
  for (var i = 0; i < 40; i++) {
    var size = 1 + Math.floor(R() * 4);
    var day = ["Thur", "Fri", "Sat", "Sun"][Math.floor(R() * 4)];
    var time = R() < 0.5 ? "Lunch" : "Dinner";
    var total_bill = DS.round(2 + 8 * size + 4.5 * R() + 12 * R() * R(), 2);
    var tip = DS.round(total_bill * (0.15 + R() * 0.08 - R() * 0.05), 2);
    if (tip < 0.5) tip = 0.5;
    TIPS.push({ total_bill: total_bill, tip: tip, size: size, day: day, time: time });
  }

  DS.registerTopic({
    id: "seaborn",
    title: "Seaborn",
    icon: "ðŸŒŠ",
    subtitle: "Beautiful statistical charts â€” one line at a time",
    order: 7,
    countable: true,
    render: function (root) {
      root.appendChild(el("h1", { text: "ðŸŒŠ Seaborn" }));
      root.appendChild(el("p", { class: "section-intro", text: "Seaborn is built on top of Matplotlib. It speaks Pandas, does statistics for you, and ships with beautiful defaults. Think of it as a \"point-and-shoot camera\" compared to Matplotlib's full manual SLR." }));

      /* Getting started */
      root.appendChild(el("h2", { text: "Getting started" }));
      root.appendChild(DS.runnable(
        "import seaborn as sns\nimport matplotlib.pyplot as plt\n\nsns.set_theme()  # beautiful defaults\ntips = sns.load_dataset('tips')\nsns.scatterplot(data=tips, x='total_bill', y='tip', hue='time')\nplt.show()",
        "[Scatter plot displayed â€” see the interactive gallery below]"
      ));

      /* Tips Sample Data */
      root.appendChild(el("h2", { text: "Tips Sample Data" }));
      root.appendChild(el("p", { text: "This is our seeded sample dataset (~40 rows). Here are the first 8 rows:" }));
      root.appendChild(DS.buildTable(TIPS.slice(0, 8), ["total_bill", "tip", "size", "day", "time"]));

      /* Plot Gallery */
      root.appendChild(el("h2", { text: "Seaborn Plot Gallery" }));
      root.appendChild(el("p", { text: "Click a chart type to see it rendered with the tips data, the one-line code, and what Seaborn does for you." }));

      var galleryCanvas = el("canvas", { style: { height: "300px", width: "100%", background: "var(--bg-elev-2)", borderRadius: "var(--radius-sm)" } });
      var galleryCode = el("div", { class: "np-result", style: { fontFamily: "var(--font-mono)", fontSize: ".82rem", marginTop: "8px", background: "var(--code-bg)", color: "var(--code-text)", padding: "10px 14px", borderRadius: "var(--radius-sm)", whiteSpace: "pre-wrap" } });
      var galleryNote = el("div", { class: "callout tip", style: { marginTop: "8px" } });
      var heatmapArea = el("div", { style: { display: "none" } });
      var activeChart = "scatterplot";

      function drawGallery() {
        galleryCanvas.style.display = "block";
        heatmapArea.style.display = "none";

        if (activeChart === "scatterplot") {
          var lunch = TIPS.filter(function (t) { return t.time === "Lunch"; });
          var dinner = TIPS.filter(function (t) { return t.time === "Dinner"; });
          DS.chart(galleryCanvas, {
            type: "scatter",
            series: [
              { x: lunch.map(function (t) { return t.total_bill; }), y: lunch.map(function (t) { return t.tip; }), label: "Lunch", color: "var(--brand)" },
              { x: dinner.map(function (t) { return t.total_bill; }), y: dinner.map(function (t) { return t.tip; }), label: "Dinner", color: "var(--accent)" }
            ],
            xLabel: "total_bill", yLabel: "tip"
          });
          galleryCode.textContent = "sns.scatterplot(data=tips, x='total_bill', y='tip', hue='time')";
          galleryNote.innerHTML = "ðŸŽ¨ Seaborn automatically <strong>colors by group</strong> (hue) and adds a legend.";
        } else if (activeChart === "barplot") {
          var days = ["Thur", "Fri", "Sat", "Sun"];
          var means = days.map(function (d) {
            var vals = TIPS.filter(function (t) { return t.day === d; }).map(function (t) { return t.tip; });
            return vals.length ? DS.round(DS.mean(vals)) : 0;
          });
          DS.chart(galleryCanvas, {
            type: "bar", categories: days, series: [{ y: means }],
            xLabel: "day", yLabel: "mean tip"
          });
          galleryCode.textContent = "sns.barplot(data=tips, x='day', y='tip')";
          galleryNote.innerHTML = "ðŸ“Š Seaborn computes the <strong>mean</strong> and adds confidence interval error bars automatically.";
        } else if (activeChart === "histplot") {
          DS.chart(galleryCanvas, {
            type: "hist", data: TIPS.map(function (t) { return t.total_bill; }), bins: 10,
            xLabel: "total_bill", yLabel: "Count"
          });
          galleryCode.textContent = "sns.histplot(data=tips, x='total_bill')";
          galleryNote.innerHTML = "ðŸ”” Seaborn picks sensible bin widths and can optionally overlay a <strong>KDE curve</strong>.";
        } else if (activeChart === "lmplot") {
          // mean tip by size
          var sizes = [1, 2, 3, 4];
          var avgTip = sizes.map(function (s) {
            var vals = TIPS.filter(function (t) { return t.size === s; }).map(function (t) { return t.tip; });
            return vals.length ? DS.round(DS.mean(vals)) : 0;
          });
          DS.chart(galleryCanvas, {
            type: "line", categories: sizes.map(String),
            series: [{ y: avgTip, label: "Mean tip" }],
            xLabel: "Party size", yLabel: "Mean tip ($)"
          });
          galleryCode.textContent = "sns.lmplot(data=tips, x='size', y='tip')";
          galleryNote.innerHTML = "ðŸ“ˆ lmplot fits a <strong>linear regression</strong> with a confidence band.";
        } else if (activeChart === "regplot") {
          var xs = TIPS.map(function (t) { return t.total_bill; });
          var ys = TIPS.map(function (t) { return t.tip; });
          var fit = DS.linearFit(xs, ys);
          var xsSort = xs.slice().sort(function (a, b) { return a - b; });
          var lineX = [xsSort[0], xsSort[xsSort.length - 1]];
          var lineY = lineX.map(function (x) { return fit.slope * x + fit.intercept; });
          DS.chart(galleryCanvas, {
            type: "scatter",
            series: [
              { x: xs, y: ys, label: "Data" },
              { x: lineX, y: lineY, kind: "line", label: "Fit", markers: false, color: "var(--accent)" }
            ],
            xLabel: "total_bill", yLabel: "tip"
          });
          galleryCode.textContent = "sns.regplot(data=tips, x='total_bill', y='tip')";
          galleryNote.innerHTML = "ðŸ“ regplot adds a <strong>regression line + confidence band</strong> to a scatter plot.";
        } else if (activeChart === "heatmap") {
          galleryCanvas.style.display = "none";
          heatmapArea.style.display = "block";
          // Compute correlation matrix
          var cols = ["total_bill", "tip", "size"];
          var matrix = [];
          cols.forEach(function (c1) {
            var row = [];
            cols.forEach(function (c2) {
              var a = TIPS.map(function (t) { return t[c1]; });
              var b = TIPS.map(function (t) { return t[c2]; });
              row.push(DS.round(DS.pearsonR(a, b), 2));
            });
            matrix.push(row);
          });

          heatmapArea.innerHTML = "";
          var grid = el("div", { class: "heatmap", style: { gridTemplateColumns: "80px repeat(" + cols.length + ", 64px)" } });
          // Header
          grid.appendChild(el("div", { class: "hm-label", text: "" }));
          cols.forEach(function (c) { grid.appendChild(el("div", { class: "hm-label", text: c })); });
          // Rows
          matrix.forEach(function (row, ri) {
            grid.appendChild(el("div", { class: "hm-label", text: cols[ri] }));
            row.forEach(function (val) {
              var c = DS.coolwarm(val);
              grid.appendChild(el("div", { class: "hm-cell", style: { background: c.bg, color: c.fg }, text: val.toFixed(2) }));
            });
          });
          heatmapArea.appendChild(grid);
          galleryCode.textContent = "sns.heatmap(tips[['total_bill','tip','size']].corr(), annot=True, cmap='coolwarm')";
          galleryNote.innerHTML = "ðŸ”¥ Seaborn <strong>colors the matrix</strong> with a diverging colormap and annotates each cell.";
        }
      }

      var chartTypes = [
        { id: "scatterplot", label: "scatterplot" },
        { id: "barplot", label: "barplot" },
        { id: "histplot", label: "histplot" },
        { id: "lmplot", label: "lmplot" },
        { id: "regplot", label: "regplot" },
        { id: "heatmap", label: "heatmap" }
      ];
      var chartChips = el("div", { class: "chips" });
      var chartChipEls = [];
      chartTypes.forEach(function (ct) {
        var chip = el("span", { class: "chip" + (ct.id === "scatterplot" ? " active" : ""), text: ct.label });
        chip.addEventListener("click", function () {
          chartChipEls.forEach(function (c) { c.classList.remove("active"); });
          chip.classList.add("active");
          activeChart = ct.id;
          drawGallery();
        });
        chartChipEls.push(chip);
        chartChips.appendChild(chip);
      });

      root.appendChild(DS.widget("Seaborn Plot Gallery", "ðŸ–¼ï¸", "Interactive",
        chartChips, galleryCanvas, heatmapArea, galleryCode, galleryNote
      ));
      setTimeout(drawGallery, 100);

      /* Matplotlib vs Seaborn */
      root.appendChild(el("h2", { text: "Matplotlib vs Seaborn" }));
      root.appendChild(DS.tabs([
        {
          label: "Matplotlib (manual)",
          content: function () {
            return DS.runnable(
              "import matplotlib.pyplot as plt\n\nfor time_val in ['Lunch', 'Dinner']:\n    subset = tips[tips['time'] == time_val]\n    plt.scatter(subset['total_bill'], subset['tip'], label=time_val)\nplt.legend()\nplt.xlabel('total_bill')\nplt.ylabel('tip')\nplt.show()",
              "[Scatter plot with manual loop + legend]"
            );
          }
        },
        {
          label: "Seaborn (one line)",
          content: function () {
            return DS.runnable(
              "import seaborn as sns\n\nsns.scatterplot(data=tips, x='total_bill', y='tip', hue='time')",
              "[Same chart â€” one line!]"
            );
          }
        }
      ]));

      /* More one-liners */
      root.appendChild(el("h2", { text: "More Seaborn one-liners" }));
      root.appendChild(DS.tabs([
        {
          label: "boxplot",
          content: function () {
            return DS.runnable(
              "sns.boxplot(data=tips, x='day', y='total_bill')",
              "[Box plot showing distribution per day]"
            );
          }
        },
        {
          label: "violinplot",
          content: function () {
            return DS.runnable(
              "sns.violinplot(data=tips, x='day', y='total_bill')",
              "[Violin plot â€” KDE + box plot combined]"
            );
          }
        },
        {
          label: "pairplot",
          content: function () {
            return DS.runnable(
              "sns.pairplot(tips, hue='time')",
              "[Grid of scatter + histogram for every numeric pair]"
            );
          }
        },
        {
          label: "countplot",
          content: function () {
            return DS.runnable(
              "sns.countplot(data=tips, x='day', hue='time')",
              "[Grouped bar chart of counts per day/time]"
            );
          }
        }
      ]));

      /* Quiz */
      root.appendChild(el("h2", { text: "Check your understanding" }));
      root.appendChild(DS.quiz({
        title: "Seaborn Quiz",
        questions: [
          {
            q: "What library is Seaborn built on top of?",
            options: ["NumPy", "Pandas", "Matplotlib", "Plotly"],
            answer: 2,
            explain: "Seaborn is a high-level interface built on top of Matplotlib."
          },
          {
            q: "What does the 'hue' parameter do?",
            options: ["Changes the chart background", "Adjusts the brightness", "Colors data points by a categorical variable", "Filters the data"],
            answer: 2,
            explain: "hue= splits data by a category and assigns each group a different color."
          },
          {
            q: "Which Seaborn function adds a regression line to a scatter plot?",
            options: ["sns.scatterplot", "sns.barplot", "sns.regplot", "sns.histplot"],
            answer: 2,
            explain: "sns.regplot() draws scatter points plus a fitted regression line with confidence band."
          },
          {
            q: "What does a heatmap of .corr() show?",
            options: ["Raw data values", "Missing data locations", "Pairwise correlation coefficients", "Data types"],
            answer: 2,
            explain: "A heatmap of the correlation matrix shows how strongly each pair of numeric columns is linearly related."
          }
        ]
      }));

      root.appendChild(DS.doneToggle("seaborn"));
      root.appendChild(DS.pageNav("seaborn"));
    }
  });
})();

  </script>
  <script>
(function () {
  "use strict";
  var DS = window.DS;

  /* ===== mountChart ===== */
  DS.mountChart = function (canvas, getSpec) {
    function draw() {
      var spec = typeof getSpec === "function" ? getSpec() : getSpec;
      DS.chart(canvas, spec);
    }
    DS._charts.push(draw);
    requestAnimationFrame(draw);
    return draw;
  };

  function redrawCharts() {
    DS._charts.forEach(function (d) { try { d(); } catch (e) { /* skip */ } });
  }

  /* ===== Theme ===== */
  var store = {
    get: function (k) { try { return localStorage.getItem("dse:" + k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem("dse:" + k, v); } catch (e) { /* noop */ } }
  };

  function getPreferredTheme() {
    var saved = store.get("theme");
    if (saved) return saved;
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
    return "light";
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    store.set("theme", theme);
    var btn = document.getElementById("theme-btn");
    if (btn) btn.textContent = theme === "dark" ? "â˜€ï¸" : "ðŸŒ™";
    requestAnimationFrame(function () { redrawCharts(); });
    setTimeout(function () { redrawCharts(); }, 50);
  }

  applyTheme(getPreferredTheme());

  /* ===== Build Sidebar ===== */
  var sidebar = document.getElementById("sidebar");
  var sidebarNav = sidebar.querySelector(".sidebar-nav");
  var sorted = DS.topics.slice().sort(function (a, b) { return a.order - b.order; });

  sorted.forEach(function (t) {
    var a = document.createElement("a");
    a.href = "#/" + t.id;
    a.dataset.id = t.id;
    a.innerHTML = '<span class="nav-icon">' + t.icon + '</span><span>' + t.title + '</span>';
    var tail = document.createElement("span");
    tail.className = "nav-tail";
    tail.textContent = t.order;
    a.appendChild(tail);
    sidebarNav.appendChild(a);
  });

  function updateSidebarProgress() {
    sidebarNav.querySelectorAll("a").forEach(function (a) {
      var id = a.dataset.id;
      var topic = null;
      DS.topics.forEach(function (t) { if (t.id === id) topic = t; });
      var tail = a.querySelector(".nav-tail");
      if (topic && topic.countable && DS.progress.isDone(id)) {
        tail.textContent = "âœ“";
        tail.classList.add("nav-check");
      } else if (topic) {
        tail.textContent = topic.order;
        tail.classList.remove("nav-check");
      }
    });
    // Update progress pill
    var countable = DS.topics.filter(function (t) { return t.countable; });
    var done = countable.filter(function (t) { return DS.progress.isDone(t.id); }).length;
    var pct = countable.length ? Math.round(done / countable.length * 100) : 0;
    var pill = document.getElementById("progress-pill");
    if (pill) pill.textContent = pct + "% complete";
  }

  window.addEventListener("dse:progress", updateSidebarProgress);
  updateSidebarProgress();

  /* ===== Router ===== */
  var app = document.getElementById("app");

  function route() {
    var hash = location.hash.replace(/^#\/?/, "") || "home";
    var topic = null;
    DS.topics.forEach(function (t) { if (t.id === hash) topic = t; });
    if (!topic) { topic = DS.topics.filter(function (t) { return t.id === "home"; })[0]; hash = "home"; }

    // Clear app
    app.innerHTML = "";
    DS._charts = [];

    // Update title
    document.title = topic.title + " â€” Data Science Explorer";

    // Render
    topic.render(app);

    // Active nav
    sidebarNav.querySelectorAll("a").forEach(function (a) {
      a.classList.toggle("active", a.dataset.id === hash);
    });

    // Close mobile menu
    sidebar.classList.remove("open");
    document.getElementById("scrim").classList.remove("open");

    // Scroll to top
    window.scrollTo(0, 0);

    // Redraw charts after layout settles
    requestAnimationFrame(redrawCharts);
    setTimeout(redrawCharts, 80);
  }

  window.addEventListener("hashchange", route);
  route();

  /* ===== Theme Button ===== */
  document.getElementById("theme-btn").addEventListener("click", function () {
    var current = document.documentElement.dataset.theme || "light";
    applyTheme(current === "dark" ? "light" : "dark");
  });

  /* ===== Mobile Menu ===== */
  var hamburger = document.getElementById("hamburger");
  var scrim = document.getElementById("scrim");
  hamburger.addEventListener("click", function () {
    sidebar.classList.toggle("open");
    scrim.classList.toggle("open");
  });
  scrim.addEventListener("click", function () {
    sidebar.classList.remove("open");
    scrim.classList.remove("open");
  });

  /* Sidebar link clicks close mobile menu */
  sidebarNav.addEventListener("click", function () {
    sidebar.classList.remove("open");
    scrim.classList.remove("open");
  });

  /* ===== Reset Progress ===== */
  document.getElementById("reset-btn").addEventListener("click", function () {
    if (confirm("Reset all progress? This cannot be undone.")) {
      DS.progress.reset();
      updateSidebarProgress();
      route();
    }
  });

  /* ===== Resize redraw ===== */
  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(redrawCharts, 150);
  });

})();

  </script>
</body>
