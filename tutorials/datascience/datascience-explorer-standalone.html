<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Data Science Explorer</title>
  <meta name="description" content="Interactive educational website teaching Python data science."/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4CA;</text></svg>"/>
  <style>
/* ===== DATA SCIENCE EXPLORER â€” DESIGN SYSTEM ===== */

/* ---------- Reset ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);line-height:1.7;
  transition:background .35s,color .35s}
img{max-width:100%;display:block}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit}

/* ---------- Design Tokens ---------- */
:root{
  --font-sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"Cascadia Code","Fira Code","Consolas",ui-monospace,monospace;
  --bg:#f6f8fc;--bg-elev:#ffffff;--bg-elev-2:#eef2f9;
  --text:#1a2233;--text-soft:#4a5568;--muted:#7b8496;
  --border:#e2e8f0;--border-strong:#cbd5e1;
  --brand:#4f46e5;--brand-2:#0d9488;--brand-soft:#eef2ff;
  --accent:#f59e0b;--good:#10b981;--bad:#ef4444;--warn:#f59e0b;
  --code-bg:#0f172a;--code-text:#e2e8f0;
  --radius:14px;--radius-sm:9px;--topbar-h:68px;--sidebar-w:268px;
  --grad:linear-gradient(120deg,var(--brand),var(--brand-2));
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.1);
  --shadow-md:0 4px 12px rgba(15,23,42,.08),0 2px 4px rgba(15,23,42,.06);
  --shadow-lg:0 20px 40px rgba(15,23,42,.12);
}
[data-theme="dark"]{
  --bg:#0b1120;--bg-elev:#131c31;--bg-elev-2:#1c2740;
  --text:#e6edf3;--text-soft:#8a99a8;--muted:#67748b;
  --border:#26344c;--border-strong:#33415c;
  --brand:#6366f1;--brand-2:#2dd4bf;--brand-soft:#1e2740;
  --accent:#fbbf24;--code-bg:#000000;--code-text:#e2e8f0;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 6px 16px rgba(0,0,0,.45);--shadow-lg:0 24px 48px rgba(0,0,0,.55);
}

/* ---------- Layout ---------- */
.topbar{
  position:sticky;top:0;z-index:100;height:var(--topbar-h);display:flex;align-items:center;
  padding:0 24px;gap:16px;
  background:color-mix(in srgb,var(--bg-elev) 85%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  transition:background .35s;
}
.topbar .hamburger{display:none;font-size:24px;color:var(--text);padding:4px 8px}
.topbar .brand{font-weight:700;font-size:1.15rem;color:var(--text);display:flex;align-items:center;gap:8px;white-space:nowrap}
.topbar .brand:hover{text-decoration:none}
.topbar .spacer{flex:1}
.progress-pill{
  background:var(--grad);color:#fff;font-size:.78rem;font-weight:600;
  padding:5px 16px;border-radius:20px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(79,70,229,.25);
}
.theme-btn{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border);
  transition:background .3s,color .3s,border .3s;
}
.theme-btn:hover{background:var(--brand-soft);color:var(--brand)}

/* Sidebar */
.sidebar{
  position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);
  background:var(--bg-elev);border-right:1px solid var(--border);
  overflow-y:auto;z-index:90;display:flex;flex-direction:column;
  transition:background .35s,border .35s;
}
.sidebar-nav{flex:1;padding:12px 0}
.sidebar-nav a{
  display:flex;align-items:center;gap:12px;padding:10px 20px;color:var(--text-soft);
  font-size:.92rem;font-weight:500;border-left:4px solid transparent;
  transition:all .2s;text-decoration:none;position:relative;
}
.sidebar-nav a:hover{background:var(--bg-elev-2);color:var(--text)}
.sidebar-nav a.active{
  background:var(--brand-soft);color:var(--brand);border-left-color:var(--brand);font-weight:600;
}
.sidebar-nav .nav-icon{
  width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;background:var(--bg-elev-2);flex-shrink:0;
  transition:background .3s;
}
.sidebar-nav a.active .nav-icon{background:color-mix(in srgb,var(--brand) 15%,transparent)}
.sidebar-nav .nav-tail{margin-left:auto;font-size:.75rem;color:var(--muted);font-weight:400}
.sidebar-nav a.active .nav-tail{color:var(--brand)}
.nav-check{color:var(--good) !important;font-weight:700 !important}
.sidebar-footer{
  padding:16px 20px;border-top:1px solid var(--border);font-size:.78rem;color:var(--muted);
  display:flex;flex-direction:column;gap:8px;
}
.sidebar-footer .reset-btn{
  background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;
  color:var(--text-soft);font-size:.78rem;cursor:pointer;transition:all .2s;
}
.sidebar-footer .reset-btn:hover{border-color:var(--bad);color:var(--bad)}
.sidebar-footer .tech-note{font-size:.7rem;opacity:.7;text-align:center}

/* Main */
.main{
  margin-left:var(--sidebar-w);padding:36px 40px 60px;transition:margin .3s;
}
.main-inner{max-width:1040px;margin:0 auto}
#app{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Scrim */
.scrim{
  display:none;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.45);
  opacity:0;transition:opacity .3s;
}
.scrim.open{display:block;opacity:1}

/* ---------- Mobile ---------- */
@media(max-width:860px){
  .topbar .hamburger{display:flex}
  .sidebar{transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:24px 16px 48px}
}

/* ---------- Typography ---------- */
h1{font-size:2.2rem;font-weight:800;line-height:1.25;margin-bottom:12px}
h2{font-size:1.55rem;font-weight:700;line-height:1.3;margin-bottom:10px;margin-top:36px;color:var(--text)}
h3{font-size:1.2rem;font-weight:600;line-height:1.4;margin-bottom:8px;color:var(--text)}
p{margin-bottom:14px;color:var(--text-soft)}
hr{border:none;border-top:1px solid var(--border);margin:32px 0}
.section-intro{font-size:1.05rem;color:var(--text-soft);margin-bottom:24px;max-width:720px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:var(--radius-sm);
  font-weight:600;font-size:.9rem;cursor:pointer;transition:all .2s;border:none;
  text-decoration:none;white-space:nowrap;
}
.btn-primary,.btn:not(.secondary):not(.ghost){
  background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.2);
}
.btn-primary:hover,.btn:not(.secondary):not(.ghost):hover{
  transform:translateY(-1px);box-shadow:0 4px 16px rgba(79,70,229,.3);text-decoration:none;
}
.btn.secondary{
  background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border);
}
.btn.secondary:hover{border-color:var(--brand);color:var(--brand);text-decoration:none}
.btn.ghost{background:none;color:var(--brand);padding:6px 12px}
.btn.ghost:hover{background:var(--brand-soft);text-decoration:none}
.btn.small{padding:6px 14px;font-size:.82rem}

/* ---------- Code Block ---------- */
.code{
  background:var(--code-bg);border-radius:var(--radius);overflow:hidden;
  margin:16px 0;box-shadow:var(--shadow-md);
}
.code-head{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08);
}
.code-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.code-dot.r{background:#ff5f57}.code-dot.y{background:#febc2e}.code-dot.g{background:#28c840}
.code-head .lang{margin-left:8px;font-size:.75rem;color:rgba(255,255,255,.45);font-family:var(--font-mono)}
.copy-btn{
  margin-left:auto;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:none;
  padding:4px 12px;border-radius:6px;font-size:.75rem;cursor:pointer;font-family:var(--font-mono);
  transition:all .2s;
}
.copy-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.code-body{
  padding:16px 20px;overflow-x:auto;font-family:var(--font-mono);font-size:.88rem;
  line-height:1.7;color:var(--code-text);
}
.code-body pre{margin:0;white-space:pre;font-family:inherit}

/* Syntax tokens */
.tok-kw{color:#c792ea}.tok-str{color:#c3e88d}.tok-num{color:#f78c6c}
.tok-com{color:#677598;font-style:italic}.tok-fn{color:#82aaff}.tok-bi{color:#ffcb6b}

/* Output */
.output{
  background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 18px;font-family:var(--font-mono);font-size:.86rem;color:var(--text);
  margin-top:8px;white-space:pre-wrap;line-height:1.6;
}
.run-btn{margin-top:8px;display:inline-flex}
.run-note{font-size:.75rem;color:var(--muted);margin-top:6px;font-style:italic}

/* ---------- Callout ---------- */
.callout{
  border-left:4px solid var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--bg-elev));
  padding:16px 20px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  margin:16px 0;font-size:.92rem;
}
.callout.tip{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--bg-elev))}
.callout.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--bg-elev))}
.callout.info{border-left-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--bg-elev))}
.callout.key{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg-elev))}
.callout.error{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--bg-elev))}

/* ---------- Widget ---------- */
.widget{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-elev);
  margin:24px 0;box-shadow:var(--shadow-sm);overflow:hidden;transition:border .3s,background .3s;
}
.widget-head{
  display:flex;align-items:center;gap:10px;padding:14px 20px;
  border-bottom:1px solid var(--border);font-weight:600;font-size:1rem;
  background:var(--bg-elev-2);
}
.widget-head .wh-icon{font-size:1.15rem}
.wh-tag{
  margin-left:auto;background:var(--grad);color:#fff;font-size:.7rem;font-weight:600;
  padding:3px 10px;border-radius:12px;
}
.widget-body{padding:20px}

/* ---------- Controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:12px 0}
.control{display:flex;flex-direction:column;gap:4px}
.control label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.control input[type="range"]{width:140px;accent-color:var(--brand)}
.control input[type="text"],
.control input[type="number"],
.control select{
  padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg);color:var(--text);font-size:.88rem;
  transition:border .2s;
}
.control input:focus,.control select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
.control .val{font-size:.82rem;color:var(--brand);font-weight:600;font-family:var(--font-mono)}

/* ---------- Chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:5px 14px;border-radius:20px;
  font-size:.82rem;font-weight:500;cursor:pointer;border:1px solid var(--border);
  background:var(--bg);color:var(--text-soft);transition:all .2s;
  user-select:none;
}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

/* ---------- Tabs ---------- */
.tabs{margin:16px 0}
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:0;overflow-x:auto}
.tab-btn{
  padding:10px 20px;font-size:.88rem;font-weight:500;color:var(--text-soft);
  background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;
  cursor:pointer;white-space:nowrap;transition:all .2s;
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.tab-panel{display:none;padding:16px 0}
.tab-panel.active{display:block}

/* ---------- Quiz ---------- */
.quiz{
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:24px 0;
  background:var(--bg-elev);box-shadow:var(--shadow-sm);
}
.quiz-header{
  background:var(--grad);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;
  font-weight:600;font-size:1rem;
}
.quiz-score{margin-left:auto;font-family:var(--font-mono);font-size:.92rem}
.quiz-body{padding:20px}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.quiz-q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.quiz-q p{font-weight:600;color:var(--text);margin-bottom:10px}
.quiz-opts{display:flex;flex-direction:column;gap:6px}
.quiz-opt{
  padding:10px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);
  cursor:pointer;font-size:.9rem;color:var(--text);transition:all .2s;
  background:var(--bg);text-align:left;
}
.quiz-opt:hover:not(.locked){border-color:var(--brand);background:var(--brand-soft)}
.quiz-opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--bg));color:var(--good);font-weight:600}
.quiz-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg));color:var(--bad)}
.quiz-opt.locked{cursor:default;opacity:.85}
.quiz-opt.locked:hover{border-color:var(--border);background:var(--bg)}
.quiz-opt.correct.locked:hover{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--bg))}
.quiz-opt.wrong.locked:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.quiz-explain{
  margin-top:8px;padding:10px 14px;border-radius:var(--radius-sm);font-size:.85rem;
  line-height:1.5;
}
.quiz-explain.right{background:color-mix(in srgb,var(--good) 10%,var(--bg));color:var(--good)}
.quiz-explain.wrong-ex{background:color-mix(in srgb,var(--bad) 10%,var(--bg));color:var(--bad)}

/* ---------- DataFrame ---------- */
.df{margin:12px 0}
.df-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
.df table{
  width:100%;border-collapse:collapse;font-size:.85rem;font-family:var(--font-mono);
}
.df th{
  background:var(--bg-elev-2);padding:8px 14px;text-align:left;font-weight:600;
  border-bottom:2px solid var(--border);position:sticky;top:0;color:var(--text);
  cursor:pointer;white-space:nowrap;user-select:none;
}
.df th:hover{color:var(--brand)}
.df th .sort-arrow{font-size:.7rem;margin-left:4px;opacity:.5}
.df td{padding:7px 14px;border-bottom:1px solid var(--border);color:var(--text-soft);white-space:nowrap}
.df tr:last-child td{border-bottom:none}
.df tr:hover td{background:var(--brand-soft)}
.df .idx{background:var(--bg-elev-2);font-weight:600;color:var(--text);position:sticky;left:0}

/* ---------- Stepper ---------- */
.stepper{display:flex;flex-direction:column;gap:0}
.step{
  display:flex;align-items:center;gap:14px;padding:12px 16px;
  cursor:pointer;border-left:3px solid var(--border);transition:all .2s;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
}
.step:hover{background:var(--bg-elev-2)}
.step.active{border-left-color:var(--brand);background:var(--brand-soft)}
.step-icon{font-size:1.3rem;flex-shrink:0}
.step-title{font-weight:600;font-size:.92rem;color:var(--text)}
.step.active .step-title{color:var(--brand)}
.step-num{font-size:.75rem;color:var(--muted);margin-left:auto;font-family:var(--font-mono)}
.step-detail{
  padding:16px 20px;margin:0 0 0 20px;border-left:3px solid var(--brand);
  background:var(--bg-elev);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
}
.step-detail p{margin-bottom:8px}
.step-detail .tools{font-size:.82rem;color:var(--muted);font-style:italic}

/* ---------- Stat Row ---------- */
.stat-row{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.stat-v{
  flex:1;min-width:110px;background:var(--bg-elev-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 16px;text-align:center;
}
.s-val{font-size:1.3rem;font-weight:700;color:var(--brand);font-family:var(--font-mono)}
.s-lab{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* ---------- Hero ---------- */
.hero{text-align:center;padding:48px 0 36px}
.eyebrow{
  display:inline-block;padding:6px 18px;border-radius:20px;font-size:.78rem;font-weight:600;
  background:var(--brand-soft);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 20%,transparent);
  margin-bottom:16px;
}
.grad-text{
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;font-size:2.6rem;font-weight:800;line-height:1.2;margin-bottom:16px;
}
.hero .lead{font-size:1.1rem;color:var(--text-soft);max-width:600px;margin:0 auto 24px}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- Topic Cards ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:20px 0}
.topic-card{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-elev);
  padding:20px;cursor:pointer;transition:all .25s;text-decoration:none;color:inherit;display:block;
}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--brand);text-decoration:none}
.topic-card .tc-icon{font-size:1.8rem;margin-bottom:8px}
.topic-card .tc-title{font-weight:700;font-size:1rem;color:var(--text);margin-bottom:4px}
.topic-card .tc-sub{font-size:.82rem;color:var(--text-soft);line-height:1.5}
.topic-card .tc-order{font-size:.7rem;color:var(--muted);margin-top:8px;font-family:var(--font-mono)}

/* Feature grid */
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:20px 0}
.p-grid .feat{
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:16px;text-align:center;
}
.p-grid .feat .f-icon{font-size:1.6rem;margin-bottom:6px}
.p-grid .feat .f-title{font-weight:600;font-size:.9rem;margin-bottom:4px;color:var(--text)}
.p-grid .feat .f-desc{font-size:.8rem;color:var(--text-soft)}

/* ---------- Inline ---------- */
.inline-code{
  font-family:var(--font-mono);font-size:.86em;background:var(--bg-elev-2);
  padding:2px 7px;border-radius:5px;color:var(--brand);border:1px solid var(--border);
}
.kbd{
  font-family:var(--font-mono);font-size:.82em;background:var(--bg-elev-2);
  padding:2px 8px;border-radius:5px;border:1px solid var(--border-strong);
  box-shadow:0 1px 0 var(--border-strong);color:var(--text);
}

/* ---------- Page Nav ---------- */
.page-nav{
  display:flex;justify-content:space-between;align-items:center;margin-top:40px;
  padding-top:24px;border-top:1px solid var(--border);gap:12px;flex-wrap:wrap;
}
.page-nav a{
  display:inline-flex;align-items:center;gap:6px;padding:10px 20px;
  border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);
  font-weight:500;font-size:.9rem;transition:all .2s;text-decoration:none;
}
.page-nav a:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);text-decoration:none}

/* ---------- Done Toggle ---------- */
.done-toggle{margin:24px 0}
.done-toggle .btn{min-width:200px;justify-content:center}

/* ---------- NumPy Grid ---------- */
.np-grid{display:inline-grid;gap:2px;margin:12px 0}
.np-cell{
  width:46px;height:36px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:.82rem;border:1px solid var(--border);
  border-radius:4px;background:var(--bg-elev);color:var(--text);transition:all .2s;
}
.np-cell.active{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.np-result{
  margin-top:12px;padding:12px 16px;background:var(--bg-elev-2);border-radius:var(--radius-sm);
  font-family:var(--font-mono);font-size:.88rem;
}

/* ---------- Number Line ---------- */
.number-line{position:relative;height:80px;margin:20px 0;background:var(--bg-elev-2);border-radius:var(--radius-sm);overflow:hidden}
.nl-track{position:absolute;top:50%;left:20px;right:20px;height:2px;background:var(--border-strong)}
.nl-point{
  position:absolute;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);
  background:var(--text-soft);z-index:2;
}
.nl-marker{
  position:absolute;top:20%;width:3px;transform:translateX(-50%);border-radius:2px;z-index:3;
}
.nl-band{
  position:absolute;top:35%;height:30%;opacity:.15;border-radius:4px;z-index:1;
}
.nl-label{
  position:absolute;bottom:4px;font-size:.65rem;font-family:var(--font-mono);
  transform:translateX(-50%);color:var(--muted);white-space:nowrap;
}

/* ---------- Heatmap ---------- */
.heatmap{display:inline-grid;gap:2px;margin:12px 0}
.hm-cell{
  width:64px;height:40px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:.78rem;font-weight:600;border-radius:3px;
}
.hm-label{
  display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:600;
  color:var(--text);background:var(--bg-elev-2);border-radius:3px;
}

/* ---------- Canvas ---------- */
canvas{width:100%;border-radius:var(--radius-sm);display:block}

/* ---------- Misc ---------- */
.add{color:var(--brand);font-weight:600}
.error-msg{color:var(--bad);font-size:.85rem;margin-top:6px;font-family:var(--font-mono)}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0;padding:10px 14px;background:var(--bg-elev-2);border-radius:var(--radius-sm)}
.filter-row label{font-size:.82rem;font-weight:600;color:var(--text-soft)}
.filter-row input[type="checkbox"]{accent-color:var(--brand)}
.color-swatch{
  width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:all .2s;
}
.color-swatch.active{border-color:var(--text);transform:scale(1.15)}
.suggested-path{counter-reset:sp;list-style:none;padding:0}
.suggested-path li{
  counter-increment:sp;padding:8px 0 8px 40px;position:relative;border-left:2px solid var(--border);
  margin-left:14px;color:var(--text-soft);font-size:.92rem;
}
.suggested-path li::before{
  content:counter(sp);position:absolute;left:-14px;top:6px;width:26px;height:26px;
  background:var(--brand);color:#fff;border-radius:50%;font-size:.75rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

  <script>
(function () {
  "use strict";

  /* ===== Topic Registry ===== */

  /* ===== DOM Builder ===== */
  DS.el = function (tag, attrs) {

        } else if (k.slice(0, 2) === "on" && typeof attrs[k] === "function") {

  };

  /* ===== setContext ===== */
  DS.setContext = function (el, c) {

  /* ===== Escape HTML ===== */
  DS.escapeHtml = function (s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")

  };
  /* ===== Python Syntax Highlighter ===== */
  DS.pyHighlight = function (code) {
    var keywords = {};
    "False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" ").forEach(function (k) { keywords[k] = true; });
    var builtins = {};
    "print len range list dict set tuple int float str bool sum min max abs sorted enumerate zip map filter type round open input format isinstance reversed any all np pd plt".split(" ").forEach(function (k) { builtins[k] = true; });

    // Scan the raw code and produce HTML directly
    var out = "";
    var i = 0;
    var len = code.length;

    function esc(s) { return DS.escapeHtml(s); }

    while (i < len) {
      var ch = code[i];

      if (ch === "#") {
        var end = code.indexOf("\n", i);
        if (end === -1) end = len;
        out += '<span class="tok-com">' + esc(code.slice(i, end)) + "</span>";
        i = end;
        continue;
      }
      // String (single/double, triple-quoted)
      if (ch === '"' || ch === "'") {
        var q = ch;
        var triple = (i + 2 < len && code[i + 1] === q && code[i + 2] === q);

          while (close < len && code[close] !== q) {
            if (code[close] === "\\") close++;
            close++;
          }
          if (close < len) close++;
        }
        out += '<span class="tok-str">' + esc(code.slice(start, close)) + "</span>";
        i = close;
        continue;
      }
      // Number
      if ((ch >= "0" && ch <= "9") || (ch === "." && i + 1 < len && code[i + 1] >= "0" && code[i + 1] <= "9")) {
        var ns = i;
        while (i < len && ((code[i] >= "0" && code[i] <= "9") || code[i] === ".")) i++;
        out += '<span class="tok-num">' + esc(code.slice(ns, i)) + "</span>";
        continue;
      }
      // Identifier / keyword / builtin / function
      if ((ch >= "a" && ch <= "z") || (ch >= "A" && ch <= "Z") || ch === "_") {
        var ws = i;
        while (i < len && ((code[i] >= "a" && code[i] <= "z") || (code[i] >= "A" && code[i] <= "Z") || (code[i] >= "0" && code[i] <= "9") || code[i] === "_")) i++;

        else if (builtins[word]) out += '<span class="tok-bi">' + esc(word) + "</span>";
        else if (j < len && code[j] === "(") out += '<span class="tok-fn">' + esc(word) + "</span>";

        continue;
      }
      // Other character
      out += esc(ch);
      i++;
    }
    return out;
  };

  /* ===== Code Block ===== */
  DS.codeBlock = function (code, lang) {

    var head = DS.el("div", { class: "code-head" },
      DS.el("span", { class: "code-dot r" }),

      DS.el("span", { class: "lang", text: lang })
    );

    wrap.appendChild(body);

  };

  /* ===== Runnable ===== */
  DS.runnable = function (code, output, note) {

  };

  /* ===== Callout ===== */
  DS.callout = function (type, content) {
    var c = DS.el("div", { class: "callout " + type });

    else if (content instanceof Node) c.appendChild(content);

  };

  /* ===== Widget ===== */
  DS.widget = function (title, icon, tag) {
    var w = DS.el("div", { class: "widget" });

      DS.el("span", { class: "wh-icon", text: icon }),
      DS.el("span", { text: title })
    );

  };

  /* ===== Tabs ===== */
  DS.tabs = function (items) {

        var result = item.content();
        if (typeof result === "string") panel.innerHTML = result;
        else if (result instanceof Node) panel.appendChild(result);
      } else if (typeof item.content === "string") {
        panel.innerHTML = item.content;
      } else if (item.content instanceof Node) {
        panel.appendChild(item.content);
      }
      btn.addEventListener("click", function () {

        panel.classList.add("active");
      });
      bar.appendChild(btn);
      panels.push(panel);
    });
    wrap.appendChild(bar);
    panels.forEach(function (p) { wrap.appendChild(p); });
    return wrap;
  };

  /* ===== Quiz ===== */
  DS.quiz = function (cfg) {
    var score = 0;
    var total = cfg.questions ? cfg.questions.length : (cfg.length || 0);
    var questions = cfg.questions || cfg;
    var title = cfg.title || "Quiz";
    var wrap = DS.el("div", { class: "quiz" });
    var scoreSpan = DS.el("span", { class: "quiz-score", text: "0 / " + total });
    var header = DS.el("div", { class: "quiz-header" },
      DS.el("span", { text: "ðŸ§ " }),
      DS.el("span", { text: title }),
      scoreSpan
    );
    wrap.appendChild(header);
    var body = DS.el("div", { class: "quiz-body" });
    questions.forEach(function (q) {
      var qDiv = DS.el("div", { class: "quiz-q" });
      qDiv.appendChild(DS.el("p", { text: q.q }));
      var opts = DS.el("div", { class: "quiz-opts" });
      var locked = false;
      q.options.forEach(function (opt, oi) {
        var oBtn = DS.el("button", { class: "quiz-opt", text: opt });

          if (locked) return;

          opts.querySelectorAll(".quiz-opt").forEach(function (b) { b.classList.add("locked"); });

          if (correct) {
            oBtn.classList.add("correct");

            scoreSpan.textContent = score + " / " + total;
          } else {
            oBtn.classList.add("wrong");
            opts.children[q.answer].classList.add("correct");

            qDiv.appendChild(ex);
          }
        });
        opts.appendChild(oBtn);
      });
      qDiv.appendChild(opts);
      body.appendChild(qDiv);
    });
    wrap.appendChild(body);
    return wrap;
  };

  /* ===== Page Nav ===== */
  DS.pageNav = function (currentId) {
    var sorted = DS.topics.slice().sort(function (a, b) { return a.order - b.order; });
    var idx = -1;
    sorted.forEach(function (t, i) { if (t.id === currentId) idx = i; });
    var nav = DS.el("div", { class: "page-nav" });
    if (idx > 0) {
      var prev = sorted[idx - 1];
      nav.appendChild(DS.el("a", { href: "#/" + prev.id, text: "â† " + prev.title }));
    } else {
      nav.appendChild(DS.el("span"));
    }
    if (idx < sorted.length - 1) {
      var next = sorted[idx + 1];
      nav.appendChild(DS.el("a", { href: "#/" + next.id, text: next.title + " â†’" }));
    }
    return nav;
  };

  /* ===== Progress ===== */
  DS.progress = (function () {
    var KEY = "dse:progress";
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
    }
    function save(d) {
      try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* noop */ }
      window.dispatchEvent(new Event("dse:progress"));
    }
    return {
      isDone: function (id) { return !!load()[id]; },
      set: function (id, val) { var d = load(); d[id] = val; save(d); },
      toggle: function (id) { var d = load(); d[id] = !d[id]; save(d); },
      reset: function () { save({}); },
      data: load
    };
  })();

  /* ===== Done Toggle ===== */
  DS.doneToggle = function (id) {
    var wrap = DS.el("div", { class: "done-toggle" });
    var done = DS.progress.isDone(id);
    var btn = DS.el("button", {
      class: "btn " + (done ? "secondary" : ""),
      text: done ? "âœ“ Completed â€” click to undo" : "Mark as complete âœ“"
    });
    btn.addEventListener("click", function () {
      DS.progress.toggle(id);
      done = DS.progress.isDone(id);
      btn.textContent = done ? "âœ“ Completed â€” click to undo" : "Mark as complete âœ“";
      btn.className = "btn " + (done ? "secondary" : "");
    });
    wrap.appendChild(btn);
    return wrap;
  };

  /* ===== Math Helpers ===== */
  DS.range = function (n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; };
  DS.linspace = function (a, b, n) {
    var out = []; var step = (b - a) / (n - 1);
    for (var i = 0; i < n; i++) out.push(a + step * i);
    return out;
  };
  DS.sum = function (a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; };
  DS.mean = function (a) { return DS.sum(a) / a.length; };
  DS.median = function (a) {
    var s = a.slice().sort(function (x, y) { return x - y; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  DS.mode = function (a) {
    var freq = {}, maxF = 0, modes = [];
    a.forEach(function (v) { freq[v] = (freq[v] || 0) + 1; if (freq[v] > maxF) maxF = freq[v]; });
    Object.keys(freq).forEach(function (k) { if (freq[k] === maxF) modes.push(Number(k)); });
    return modes.length === a.length ? null : modes[0];
  };
  DS.variance = function (a, pop) {
    var m = DS.mean(a), s = 0;
    a.forEach(function (v) { s += (v - m) * (v - m); });

  DS.round = function (x, d) { d = d === undefined ? 2 : d; var f = Math.pow(10, d); return Math.round(x * f) / f; };
  DS.clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
  DS.formatNum = function (x) {
    if (Number.isInteger(x) && Math.abs(x) < 1000) return String(x);
    if (Number.isInteger(x)) return x.toLocaleString();
    return DS.round(x, 2).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  };

  /* ===== Exact Algorithms ===== */
  DS.mulberry32 = function (a) {
    return function () {
      var t = a += 1831565813;
      t = Math.imul(t ^ t >>> 15, 1 | t);
      t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };

  DS.normalSeq = function (n, seed) {
    var rnd = DS.mulberry32(seed), out = [];
    for (var i = 0; i < n; i += 2) {
      var u = Math.max(1e-9, rnd()), v = rnd();
      out.push(Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v));
    }
    return out;
  };

  /* Python slice semantics */
  DS.adjustSlice = function (len, start, stop, step) {
    if (step === 0) throw "step cannot be 0";
    var lower = step < 0 ? -1 : 0, upper = step < 0 ? len - 1 : len;
    if (start === null) start = step < 0 ? upper : lower;
    else { if (start < 0) start += len; start = start < lower ? lower : start > upper ? upper : start; }
    if (stop === null) stop = step < 0 ? lower : upper;
    else { if (stop < 0) stop += len; stop = stop < lower ? lower : stop > upper ? upper : stop; }
    var out = [];
    if (step > 0) for (var i = start; i < stop; i += step) out.push(i);
    else for (var i = start; i > stop; i += step) out.push(i);
    return out;
  };

  DS.parseSlice = function (s) {
    s = s.trim();
    if (s.indexOf(":") === -1) {
      var v = parseInt(s, 10);
      if (isNaN(v)) throw "invalid index: " + s;
      return { type: "index", value: v };
    }
    var parts = s.split(":");
    function p(x) { x = x.trim(); return x === "" ? null : parseInt(x, 10); }
    var start = p(parts[0]);
    var stop = parts.length > 1 ? p(parts[1]) : null;
    var step = parts.length > 2 ? p(parts[2]) : 1;
    if (step === null) step = 1;
    if ((start !== null && isNaN(start)) || (stop !== null && isNaN(stop)) || isNaN(step)) throw "invalid slice";
    return { type: "slice", start: start, stop: stop, step: step };
  };

  /* Coolwarm color */
  DS.coolwarm = function (v) {
    v = Math.max(-1, Math.min(1, v));
    var blue = [59, 76, 192], white = [242, 242, 242], red = [180, 4, 38];
    var c1 = v < 0 ? blue : white, c2 = v < 0 ? white : red, t = v < 0 ? v + 1 : v;
    function lerp(a, b, t) { return a.map(function (x, i) { return Math.round(x + (b[i] - x) * t); }); }

  };

  /* Pearson correlation */
  DS.pearsonR = function (x, y) {
    var n = x.length, mx = DS.mean(x), my = DS.mean(y);
    var num = 0, dx = 0, dy = 0;
    for (var i = 0; i < n; i++) {
      num += (x[i] - mx) * (y[i] - my);
      dx += (x[i] - mx) * (x[i] - mx);
      dy += (y[i] - my) * (y[i] - my);

  DS.linearFit = function (x, y) {
    var mx = DS.mean(x), my = DS.mean(y);
    var num = 0, den = 0;
    for (var i = 0; i < x.length; i++) {

  DS.chart = function (canvas, spec) {

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(Math.round(v / total * 100) + "%", lx, ly);
        angle += sweep;

(function () {

  var el = DS.el;

  DS.registerTopic({

              'import numpy as np\n\ndata = np.array([1, 2, 3, 4, 5])\nresult = data * 2       # no loop needed!\nprint(result)  # [ 2  4  6  8 10]',

            );
          }
        }
      ]));

      /* Creating arrays */
      root.appendChild(el("h2", { text: "Creating arrays" }));
      root.appendChild(DS.runnable(
        'import numpy as np\n\na = np.array([1, 2, 3])\nb = np.zeros(4)\nc = np.arange(0, 10, 2)\nd = np.linspace(0, 1, 5)\n\nprint(a)  # [1 2 3]\nprint(b)  # [0. 0. 0. 0.]\nprint(c)  # [0 2 4 6 8]\nprint(d)  # [0.   0.25 0.5  0.75 1.  ]',
        "[1 2 3]\n[0. 0. 0. 0.]\n[0 2 4 6 8]\n[0.   0.25 0.5  0.75 1.  ]"
      ));

      /* Shape Explorer */
      root.appendChild(el("h2", { text: "Shape Explorer" }));
      var shapeRows, shapeCols, shapeGrid, shapeInfo;
      function updateShape() {
        var r = parseInt(shapeRows.value, 10);

        shapeGrid.innerHTML = "";
        shapeGrid.style.gridTemplateColumns = "repeat(" + c + ", 46px)";
        var val = 0;
        for (var i = 0; i < r; i++) {
          for (var j = 0; j < c; j++) {
            shapeGrid.appendChild(el("div", { class: "np-cell", text: val++ }));
          }
        }
        shapeInfo.textContent = "shape: (" + r + ", " + c + ")  ndim: 2  size: " + (r * c) + "  dtype: int64";
      }
      shapeRows = el("input", { type: "range", min: "1", max: "6", value: "3" });
      shapeCols = el("input", { type: "range", min: "1", max: "6", value: "4" });
      var rVal = el("span", { class: "val", text: "3" });
      var cVal = el("span", { class: "val", text: "4" });
      shapeRows.addEventListener("input", function () { rVal.textContent = shapeRows.value; updateShape(); });
      shapeCols.addEventListener("input", function () { cVal.textContent = shapeCols.value; updateShape(); });
      shapeGrid = el("div", { class: "np-grid" });
      shapeInfo = el("div", { class: "np-result" });
      root.appendChild(DS.widget("Shape Explorer", "ðŸ“", "Interactive",
        el("div", { class: "controls" },
          el("div", { class: "control" }, el("label", { text: "Rows" }), shapeRows, rVal),
          el("div", { class: "control" }, el("label", { text: "Cols" }), shapeCols, cVal)
        ),
        shapeGrid, shapeInfo
      ));
      updateShape();

      /* Slicing Playground */
      root.appendChild(el("h2", { text: "Slicing Playground" }));
      root.appendChild(el("p", { text: "The array below is np.arange(20).reshape(4, 5). Type a NumPy-style slice to select cells." }));

      var MATRIX = [];
      for (var i = 0; i < 4; i++) {
        MATRIX.push([]);
        for (var j = 0; j < 5; j++) MATRIX[i].push(i * 5 + j);
      }

      var sliceInput = el("input", { type: "text", value: "1:3, 1:4", style: { width: "200px" } });
      var sliceGrid = el("div", { class: "np-grid", style: { gridTemplateColumns: "repeat(5, 46px)" } });
      var sliceResult = el("div", { class: "np-result" });
      var sliceError = el("div", { class: "error-msg" });

      function renderSlice() {
        sliceGrid.innerHTML = "";
        sliceError.textContent = "";
        sliceResult.textContent = "";
        var input = sliceInput.value.trim();

        // Parse axes
        var parts;
        if (input.startsWith("[") || input.startsWith("a[")) {
          var inner = input.replace(/^a?\[/, "").replace(/\]$/, "");
          parts = inner.split(",");
        } else {
          parts = input.split(",");
        }
        if (parts.length > 2) { sliceError.textContent = "Too many dimensions (max 2 for a 4Ã—5 array)"; renderPlainGrid(); return; }

        try {
          var rowSpec = DS.parseSlice(parts[0]);
          var colSpec = parts.length > 1 ? DS.parseSlice(parts[1]) : { type: "slice", start: null, stop: null, step: 1 };

          var selectedRows, selectedCols;
          var dropRow = false, dropCol = false;

          if (rowSpec.type === "index") {
            var ri = rowSpec.value < 0 ? rowSpec.value + 4 : rowSpec.value;
            if (ri < 0 || ri >= 4) throw "row index out of bounds";
            selectedRows = [ri]; dropRow = true;
          } else {
            selectedRows = DS.adjustSlice(4, rowSpec.start, rowSpec.stop, rowSpec.step);
          }

          if (colSpec.type === "index") {
            var ci = colSpec.value < 0 ? colSpec.value + 5 : colSpec.value;
            if (ci < 0 || ci >= 5) throw "column index out of bounds";
            selectedCols = [ci]; dropCol = true;
          } else {
            selectedCols = DS.adjustSlice(5, colSpec.start, colSpec.stop, colSpec.step);
          }

          var activeSet = {};
          selectedRows.forEach(function (r) {
            selectedCols.forEach(function (c) {
              activeSet[r + "," + c] = true;
            });
          });

          // Render grid
          for (var r = 0; r < 4; r++) {
            for (var c = 0; c < 5; c++) {
              var isActive = activeSet[r + "," + c];
              sliceGrid.appendChild(el("div", {
                class: "np-cell" + (isActive ? " active" : ""),
                text: MATRIX[r][c]
              }));
            }
          }

          // Build result
          var result = [];
          selectedRows.forEach(function (r) {
            var row = [];
            selectedCols.forEach(function (c) { row.push(MATRIX[r][c]); });
            result.push(row);
          });

          // Shape
          var shape;
          if (dropRow && dropCol) {
            shape = "()" ;
            sliceResult.textContent = "Result: " + result[0][0] + "    shape: scalar";
          } else if (dropRow) {
            shape = "(" + selectedCols.length + ",)";
            sliceResult.textContent = "Result: [" + result[0].join(", ") + "]    shape: " + shape;
          } else if (dropCol) {
            shape = "(" + selectedRows.length + ",)";
            var flat = result.map(function (r) { return r[0]; });
            sliceResult.textContent = "Result: [" + flat.join(", ") + "]    shape: " + shape;
          } else {
            shape = "(" + selectedRows.length + ", " + selectedCols.length + ")";
            var rows = result.map(function (r) { return "[" + r.join(", ") + "]"; });
            sliceResult.textContent = "Result: [" + rows.join(", ") + "]    shape: " + shape;
          }
        } catch (e) {
          sliceError.textContent = "Error: " + e;
          renderPlainGrid();
        }
      }

      function renderPlainGrid() {
        sliceGrid.innerHTML = "";
        for (var r = 0; r < 4; r++) {
          for (var c = 0; c < 5; c++) {
            sliceGrid.appendChild(el("div", { class: "np-cell", text: MATRIX[r][c] }));
          }
        }
      }

      sliceInput.addEventListener("input", renderSlice);
      var sliceControls = el("div", { class: "controls" },
        el("div", { class: "control" },
          el("label", { text: "a[...]" }),
          sliceInput
        )
      );
      root.appendChild(DS.widget("Slicing Playground", "âœ‚ï¸", "Interactive",
        sliceControls, sliceGrid, sliceResult, sliceError
      ));
      renderSlice();

      /* Element-wise math */
      root.appendChild(el("h2", { text: "Element-wise math" }));
      root.appendChild(DS.runnable(
        'import numpy as np\n\na = np.array([10, 20, 30, 40, 50])\nprint(a + 5)     # [15 25 35 45 55]\nprint(a * 2)     # [ 20  40  60  80 100]\nprint(a > 25)    # [False False  True  True  True]\nprint(np.sqrt(a))',
        "[15 25 35 45 55]\n[ 20  40  60  80 100]\n[False False  True  True  True]\n[3.16227766 4.47213595 5.47722558 6.32455532 7.07106781]"
      ));

      /* Axis Aggregator */
      root.appendChild(el("h2", { text: "Axis Aggregator" }));

      var axisOp, axisChips;
      var axisGrid = el("div", { class: "np-grid", style: { gridTemplateColumns: "repeat(5, 46px)" } });
      var axisResult = el("div", { class: "np-result" });
      var axisCode = el("div", { class: "np-result", style: { fontFamily: "var(--font-mono)", fontSize: ".85rem", marginTop: "6px", background: "var(--code-bg)", color: "var(--code-text)", padding: "10px 14px", borderRadius: "var(--radius-sm)" } });
      var currentAxis = null; // null, 0, 1

      function updateAxis() {
        axisGrid.innerHTML = "";
        for (var r = 0; r < 4; r++) {
          for (var c = 0; c < 5; c++) {
            axisGrid.appendChild(el("div", { class: "np-cell", text: MATRIX[r][c] }));
          }
        }

        var op = axisOp.value;
        var result, shape, caption;

        if (currentAxis === null) {
          // no axis â€” flatten
          var flat = [];
          MATRIX.forEach(function (r) { r.forEach(function (v) { flat.push(v); }); });
          if (op === "sum") result = DS.sum(flat);
          else if (op === "mean") result = DS.round(DS.mean(flat));
          else result = Math.max.apply(null, flat);
          shape = "scalar";
          caption = op + " of all elements â†’ single number";
          axisCode.textContent = "a." + op + "()  â†’  " + result;
          axisResult.textContent = "Result: " + result + "    shape: " + shape + "\n" + caption;
        } else if (currentAxis === 0) {
          // collapse rows
          var cols = [];
          for (var c = 0; c < 5; c++) {
            var col = [];
            for (var r = 0; r < 4; r++) col.push(MATRIX[r][c]);
            if (op === "sum") cols.push(DS.sum(col));
            else if (op === "mean") cols.push(DS.round(DS.mean(col)));
            else cols.push(Math.max.apply(null, col));
          }
          shape = "(5,)";
          caption = "Collapse rows â†“ â€” one result per column";
          axisCode.textContent = "a." + op + "(axis=0)  â†’  [" + cols.join(", ") + "]";
          axisResult.textContent = "Result: [" + cols.join(", ") + "]    shape: " + shape + "\n" + caption;
        } else {
          // collapse cols
          var rows = [];
          for (var r = 0; r < 4; r++) {
            if (op === "sum") rows.push(DS.sum(MATRIX[r]));
            else if (op === "mean") rows.push(DS.round(DS.mean(MATRIX[r])));
            else rows.push(Math.max.apply(null, MATRIX[r]));
          }
          shape = "(4,)";
          caption = "Collapse columns â†’ â€” one result per row";
          axisCode.textContent = "a." + op + "(axis=1)  â†’  [" + rows.join(", ") + "]";
          axisResult.textContent = "Result: [" + rows.join(", ") + "]    shape: " + shape + "\n" + caption;
        }
      }

      axisOp = el("select", null,
        el("option", { value: "sum", text: "sum" }),
        el("option", { value: "mean", text: "mean" }),
        el("option", { value: "max", text: "max" })
      );
      axisOp.addEventListener("change", updateAxis);

      var axisOptions = [
        { label: "None (flatten)", value: null },
        { label: "0 â†“ (collapse rows)", value: 0 },
        { label: "1 â†’ (collapse cols)", value: 1 }
      ];
      var chipEls = [];
      var axisChipWrap = el("div", { class: "chips" });
      axisOptions.forEach(function (opt, i) {
        var chip = el("span", { class: "chip" + (i === 0 ? " active" : ""), text: opt.label });
        chip.addEventListener("click", function () {
          chipEls.forEach(function (c) { c.classList.remove("active"); });
          chip.classList.add("active");
          currentAxis = opt.value;
          updateAxis();
        });
        chipEls.push(chip);
        axisChipWrap.appendChild(chip);
      });

      root.appendChild(DS.widget("Axis Aggregator", "ðŸ“", "Interactive",
        el("div", { class: "controls" },
          el("div", { class: "control" }, el("label", { text: "Operation" }), axisOp),
          el("div", { class: "control" }, el("label", { text: "Axis" }), axisChipWrap)
        ),
        axisGrid, axisCode, axisResult
      ));
      updateAxis();

      /* Quiz */
      root.appendChild(el("h2", { text: "Check your understanding" }));
      root.appendChild(DS.quiz({
        title: "NumPy Quiz",
        questions: [
          {
            q: "What does np.arange(20).reshape(4,5) create?",
            options: ["A list of 20 items", "A 4Ã—5 matrix with values 0-19", "A 5Ã—4 matrix", "A 20Ã—1 vector"],
            answer: 1,
            explain: "arange(20) creates [0..19], reshape(4,5) arranges them into 4 rows Ã— 5 columns."
          },
          {
            q: "Given a 4Ã—5 matrix, what does a.sum(axis=0) produce?",
            options: ["A single number", "An array of 4 values (one per row)", "An array of 5 values (one per column)", "A 4Ã—5 matrix"],
            answer: 2,
            explain: "axis=0 collapses rows, leaving one sum per column â†’ 5 values."
          },
          {
            q: "What is a[:, 2] on a 4Ã—5 array?",
            options: ["Row 2", "Column 2 (4 values)", "A 2Ã—5 slice", "An error"],
            answer: 1,
            explain: "[:, 2] means 'all rows, column index 2' â†’ a 1D array of 4 values."
          }
        ]
      }));

      root.appendChild(DS.doneToggle("numpy"));
      root.appendChild(DS.pageNav("numpy"));
    }
  });
})();

        "0    10\n1    20\n2    30\nName: sales, dtype: int64\n\n  product  units\n0   Latte     30\n1   Mocha     20\n2     Tea     15"
      ));

      /* Sample dataset */
      root.appendChild(el("h2", { text: "Our coffee-shop dataset" }));
      root.appendChild(el("p", { text: "We'll use this 9-row dataset throughout the Pandas section:" }));
      root.appendChild(DS.buildTable(DATA, ["region", "product", "units", "price", "revenue"]));

      /* DataFrame Explorer */
      root.appendChild(el("h2", { text: "DataFrame Explorer" }));

      var allCols = ["region", "product", "units", "price", "revenue"];
      var visibleCols = allCols.slice();
      var filterEnabled = false;
      var filterCol = "units";
      var filterOp = ">";
      var filterVal = "30";
      var sortCol = null;
      var sortAsc = true;
      var explorerOutput = el("div");
      var explorerCode = el("div", { class: "np-result", style: { fontFamily: "var(--font-mono)", fontSize: ".82rem", marginTop: "8px", background: "var(--code-bg)", color: "var(--code-text)", padding: "10px 14px", borderRadius: "var(--radius-sm)", whiteSpace: "pre-wrap" } });

      function updateExplorer() {
        var rows = DATA.slice();
        var codeParts = ["result = df"];
        if (filterEnabled) {
          var v = parseFloat(filterVal);
          if (!isNaN(v)) {
            rows = rows.filter(function (r) {
              var rv = r[filterCol];
              if (filterOp === ">") return rv > v;
              if (filterOp === ">=") return rv >= v;
              if (filterOp === "<") return rv < v;
              if (filterOp === "<=") return rv <= v;
              return rv === v;
            });
            codeParts.push("result = result[result['" + filterCol + "'] " + filterOp + " " + filterVal + "]");
          }
        }
        if (sortCol) {
          rows.sort(function (a, b) {
            return sortAsc ? (a[sortCol] > b[sortCol] ? 1 : -1) : (a[sortCol] < b[sortCol] ? 1 : -1);
          });
          codeParts.push("result = result.sort_values('" + sortCol + "'" + (sortAsc ? "" : ", ascending=False") + ")");
        }
        if (visibleCols.length < allCols.length) {
          codeParts.push("result = result[['" + visibleCols.join("', '") + "']]");
        }
        explorerOutput.innerHTML = "";
        explorerOutput.appendChild(DS.buildTable(rows, visibleCols, {
          onSort: function (col) {
            if (sortCol === col) sortAsc = !sortAsc;
            else { sortCol = col; sortAsc = true; }
            updateExplorer();
          }
        }));
        explorerCode.textContent = codeParts.join("\n");

      // Column chips
      var colChips = el("div", { class: "chips" });

          if (chip.classList.contains("active")) {
            if (visibleCols.indexOf(col) === -1) visibleCols.push(col);
          } else {
            visibleCols = visibleCols.filter(function (c) { return c !== col; });
          }
          visibleCols.sort(function (a, b) { return allCols.indexOf(a) - allCols.indexOf(b); });
          updateExplorer();
        });
        colChips.appendChild(chip);
      });

      // Filter row
      var fCheck = el("input", { type: "checkbox" });
      var fColSel = el("select");
      ["units", "price", "revenue"].forEach(function (c) { fColSel.appendChild(el("option", { value: c, text: c })); });
      var fOpSel = el("select");
      [">", ">=", "<", "<=", "=="].forEach(function (op) { fOpSel.appendChild(el("option", { value: op, text: op })); });
      var fValInput = el("input", { type: "text", value: "30", style: { width: "60px" } });

      fCheck.addEventListener("change", function () { filterEnabled = fCheck.checked; updateExplorer(); });
      fColSel.addEventListener("change", function () { filterCol = fColSel.value; updateExplorer(); });
      fOpSel.addEventListener("change", function () { filterOp = fOpSel.value; updateExplorer(); });
      fValInput.addEventListener("input", function () { filterVal = fValInput.value; updateExplorer(); });

      var filterRow = el("div", { class: "filter-row" },

        el("label", { text: "Filter:" }),
        fColSel, fOpSel, fValInput

      root.appendChild(DS.widget("DataFrame Explorer", "ðŸ”", "Interactive",
        el("div", null, el("label", { text: "Columns: ", style: { fontSize: ".82rem", fontWeight: "600", color: "var(--muted)" } }), colChips),
        filterRow, explorerOutput, explorerCode
      ));
      updateExplorer();

      /* GroupBy Builder */
      root.appendChild(el("h2", { text: "GroupBy Builder" }));

      var gbGroup = "region", gbCol = "revenue";
      var gbFuncs = ["sum"];
      var gbOutput = el("div");
      var gbCode = el("div", { class: "np-result", style: { fontFamily: "var(--font-mono)", fontSize: ".82rem", marginTop: "8px", background: "var(--code-bg)", color: "var(--code-text)", padding: "10px 14px", borderRadius: "var(--radius-sm)", whiteSpace: "pre-wrap" } });

      function updateGroupby() {
        var groups = {};
        DATA.forEach(function (r) {
          var key = r[gbGroup];
          if (!groups[key]) groups[key] = [];
          groups[key].push(r[gbCol]);
        });

        var resultRows = [];
        Object.keys(groups).sort().forEach(function (key) {
          var row = {};
          row[gbGroup] = key;
          gbFuncs.forEach(function (fn) {
            var vals = groups[key];
            var res;
            if (fn === "sum") res = DS.sum(vals);
            else if (fn === "mean") res = DS.round(DS.mean(vals));
            else if (fn === "count") res = vals.length;
            else if (fn === "max") res = Math.max.apply(null, vals);
            else if (fn === "min") res = Math.min.apply(null, vals);
            else if (fn === "std") res = DS.round(DS.std(vals, false));
            row[fn] = res;
          });
          resultRows.push(row);
        });

        gbOutput.innerHTML = "";
        gbOutput.appendChild(DS.buildTable(resultRows, [gbGroup].concat(gbFuncs)));

        if (gbFuncs.length === 1) {
          gbCode.textContent = "df.groupby('" + gbGroup + "')['" + gbCol + "']." + gbFuncs[0] + "()";
        } else {

      var gbFuncChips = el("div", { class: "chips" });
      var allFuncs = ["sum", "mean", "min", "max", "count", "std"];
      var funcChipEls = [];
      allFuncs.forEach(function (fn) {

        chip.addEventListener("click", function () {
          chip.classList.toggle("active");

          if (gbFuncs.length === 0) { chip.classList.add("active"); gbFuncs.push(fn); }

        gbFuncChips.appendChild(chip);
      });

      root.appendChild(DS.widget("GroupBy Builder", "ðŸ“Š", "Interactive",
        el("div", { class: "controls" },

          el("div", { class: "control" }, el("label", { text: "Column" }), gbColSel),
          el("div", { class: "control" }, el("label", { text: "Functions" }), gbFuncChips)

      ));
      updateGroupby();

      /* Three ways tabs */
      root.appendChild(DS.tabs([
        {
          label: "List of funcs",
          content: function () {
            return DS.runnable(
              "df.groupby('region')['revenue'].agg(['sum', 'mean', 'std'])",

            );
          }
        },
        {
          label: "Dict per column",
          content: function () {
            return DS.runnable(
              "df.groupby('region').agg({\n    'revenue': 'sum',\n    'units': 'mean'\n})",

            );
          }
        },
        {
          label: "Named aggregation",
          content: function () {
            return DS.runnable(
              "df.groupby('region').agg(\n    total_rev=('revenue', 'sum'),\n    avg_units=('units', 'mean')\n)",
              "         total_rev  avg_units\nregion\nEast        267.5      26.00\nNorth       285.0      30.00\nSouth       283.0      27.33"
            );
          }
        }
      ]));

      /* Cross-tabulation */
      root.appendChild(el("h2", { text: "Cross-tabulation" }));
      root.appendChild(el("p", { text: "pd.crosstab() creates a frequency table showing how often combinations of categories appear." }));

      root.appendChild(DS.runnable(
        "orders = pd.DataFrame([\n    {'day_part':'Morning','drink':'Latte','spend':4.0},\n    {'day_part':'Morning','drink':'Latte','spend':4.0},\n    {'day_part':'Morning','drink':'Latte','spend':5.0},\n    {'day_part':'Morning','drink':'Mocha','spend':4.5},\n    {'day_part':'Morning','drink':'Tea','spend':3.0},\n    {'day_part':'Morning','drink':'Latte','spend':4.5},\n    {'day_part':'Afternoon','drink':'Tea','spend':3.5},\n    {'day_part':'Afternoon','drink':'Tea','spend':3.0},\n    {'day_part':'Afternoon','drink':'Mocha','spend':4.0},\n    {'day_part':'Afternoon','drink':'Latte','spend':4.5},\n    {'day_part':'Afternoon','drink':'Tea','spend':3.5},\n    {'day_part':'Afternoon','drink':'Mocha','spend':4.5},\n])\npd.crosstab(orders['day_part'], orders['drink'])",
        "drink      Latte  Mocha  Tea\nday_part\nAfternoon      1      2    3\nMorning        4      1    1"
      ));

      /* Crosstab Builder */
      var ctRows = "day_part", ctCols = "drink", ctMode = "count", ctMargins = false;
      var ctOutput = el("div");
      var ctCode = el("div", { class: "np-result", style: { fontFamily: "var(--font-mono)", fontSize: ".82rem", marginTop: "8px", background: "var(--code-bg)", color: "var(--code-text)", padding: "10px 14px", borderRadius: "var(--radius-sm)", whiteSpace: "pre-wrap" } });

      function updateCrosstab() {
        var rowKey = ctRows, colKey = ctCols;
        var rowVals = []; var colVals = [];
        ORDERS.forEach(function (o) {
          if (rowVals.indexOf(o[rowKey]) === -1) rowVals.push(o[rowKey]);
          if (colVals.indexOf(o[colKey]) === -1) colVals.push(o[colKey]);
        });
        rowVals.sort(); colVals.sort();

        // Build cross-table
        var table = {};
        rowVals.forEach(function (rv) {
          table[rv] = {};
          colVals.forEach(function (cv) { table[rv][cv] = []; });
        });
        ORDERS.forEach(function (o) {
          table[o[rowKey]][o[colKey]].push(o.spend);
        });

        // Compute cell values
        var displayRows = [];
        rowVals.forEach(function (rv) {
          var row = {};
          row[rowKey] = rv;
          colVals.forEach(function (cv) {
            var vals = table[rv][cv];
            if (ctMode === "count") row[cv] = vals.length;
            else if (ctMode === "mean") row[cv] = vals.length ? DS.round(DS.mean(vals)) : 0;
            else row[cv] = DS.round(DS.sum(vals.map(function (v) { return v; })));
          });
          displayRows.push(row);
        });

        // Margins
        if (ctMargins) {
          // Row totals (All column)
          displayRows.forEach(function (row) {
            // Compute from underlying raw data
            var allVals = [];
            colVals.forEach(function (cv) {
              allVals = allVals.concat(table[row[rowKey]][cv]);
            });
            if (ctMode === "count") row["All"] = allVals.length;
            else if (ctMode === "mean") row["All"] = allVals.length ? DS.round(DS.mean(allVals)) : 0;
            else row["All"] = DS.round(DS.sum(allVals));
          });

          // Column totals (All row)
          var allRow = {};
          allRow[rowKey] = "All";
          colVals.forEach(function (cv) {
            var allVals = [];
            rowVals.forEach(function (rv) {
              allVals = allVals.concat(table[rv][cv]);
            });
            if (ctMode === "count") allRow[cv] = allVals.length;
            else if (ctMode === "mean") allRow[cv] = allVals.length ? DS.round(DS.mean(allVals)) : 0;
            else allRow[cv] = DS.round(DS.sum(allVals));
          });
          // Grand total
          var grandVals = [];
          ORDERS.forEach(function (o) { grandVals.push(o.spend); });
          if (ctMode === "count") allRow["All"] = grandVals.length;
          else if (ctMode === "mean") allRow["All"] = grandVals.length ? DS.round(DS.mean(grandVals)) : 0;
          else allRow["All"] = DS.round(DS.sum(grandVals));

          displayRows.push(allRow);
        }

        var displayCols = [rowKey].concat(colVals);
        if (ctMargins) displayCols.push("All");

        ctOutput.innerHTML = "";
        ctOutput.appendChild(DS.buildTable(displayRows, displayCols, { showIndex: false }));

        var codeStr = "pd.crosstab(orders['" + rowKey + "'], orders['" + colKey + "']";
        if (ctMode === "mean") codeStr += ", values=orders['spend'], aggfunc='mean'";
        else if (ctMode === "sum") codeStr += ", values=orders['spend'], aggfunc='sum'";
        if (ctMargins) codeStr += ", margins=True";
        codeStr += ")";
        ctCode.textContent = codeStr;
      }

      var ctRowSel = el("select");
      ["day_part", "drink"].forEach(function (c) { ctRowSel.appendChild(el("option", { value: c, text: c })); });
      ctRowSel.addEventListener("change", function () { ctRows = ctRowSel.value; updateCrosstab(); });
      var ctColSel = el("select");
      ["drink", "day_part"].forEach(function (c) { ctColSel.appendChild(el("option", { value: c, text: c })); });
      ctColSel.addEventListener("change", function () { ctCols = ctColSel.value; updateCrosstab(); });
      var ctModeSel = el("select");
      [["count", "count"], ["mean", "mean of spend"], ["sum", "sum of spend"]].forEach(function (c) { ctModeSel.appendChild(el("option", { value: c[0], text: c[1] })); });
      ctModeSel.addEventListener("change", function () { ctMode = ctModeSel.value; updateCrosstab(); });
      var ctMarginCheck = el("input", { type: "checkbox" });
      ctMarginCheck.addEventListener("change", function () { ctMargins = ctMarginCheck.checked; updateCrosstab(); });

      root.appendChild(DS.widget("Crosstab Builder", "ðŸ“‹", "Interactive",
        el("div", { class: "controls" },
          el("div", { class: "control" }, el("label", { text: "Rows" }), ctRowSel),
          el("div", { class: "control" }, el("label", { text: "Cols" }), ctColSel),
          el("div", { class: "control" }, el("label", { text: "Cells" }), ctModeSel),
          el("div", { class: "control" }, el("label", null, ctMarginCheck, " margins=True"))
        ),
        ctOutput, ctCode
      ));
      updateCrosstab();

      /* Normalize runnable */
      root.appendChild(DS.runnable(
        "pd.crosstab(orders['day_part'], orders['drink'], normalize='index')",
        "drink      Latte     Mocha       Tea\nday_part\nAfternoon  0.166667  0.333333  0.500000\nMorning    0.666667  0.166667  0.166667"
      ));

      /* Cheat-sheet tabs */
      root.appendChild(el("h2", { text: "Pandas Cheat Sheet" }));
      root.appendChild(DS.tabs([
        { label: "Peek", content: function () { return DS.codeBlock("df.head()        # first 5 rows\ndf.tail(3)       # last 3 rows\ndf.shape         # (rows, cols)\ndf.dtypes        # column types\ndf.describe()    # summary stats"); } },
        { label: "Select", content: function () { return DS.codeBlock("df['col']           # single column (Series)\ndf[['a','b']]       # multiple columns\ndf.loc[0:2, 'col']  # by label\ndf.iloc[0:2, 0:3]   # by position"); } },
        { label: "Clean", content: function () { return DS.codeBlock("df.dropna()         # remove missing\ndf.fillna(0)        # fill missing\ndf.drop_duplicates()\ndf.rename(columns={'old':'new'})"); } },
        { label: "New columns", content: function () { return DS.codeBlock("df['revenue'] = df['units'] * df['price']\ndf['upper'] = df['name'].str.upper()\ndf['log_rev'] = np.log(df['revenue'])"); } },
        { label: "Aggregate", content: function () { return DS.codeBlock("df.groupby('col').sum()\ndf.groupby('col').agg(['mean','std'])\ndf.groupby('col').agg(total=('val','sum'))\npd.crosstab(df['a'], df['b'])"); } }
      ]));

      /* Quiz */
      root.appendChild(el("h2", { text: "Check your understanding" }));
      root.appendChild(DS.quiz({
        title: "Pandas Quiz",
        questions: [
          {
            q: "What is the difference between a Series and a DataFrame?",
            options: ["Series is 2D, DataFrame is 1D", "Series is 1D (one column), DataFrame is 2D (table)", "They are the same", "Series can only hold numbers"],
            answer: 1,
            explain: "A Series is a single column of data. A DataFrame is a table made of multiple Series."
          },
          {
            q: "How do you filter rows where units > 30?",
            options: ["df.filter(units > 30)", "df[df['units'] > 30]", "df.where('units', '>', 30)", "df.query(units > 30)"],
            answer: 1,
            explain: "Boolean masking: df[df['units'] > 30] creates a True/False mask and keeps only True rows."
          },
          {
            q: "What does df.groupby('region')['revenue'].sum() return?",
            options: ["A DataFrame with all columns", "A single number", "A Series with one sum per region", "An error"],
            answer: 2,
            explain: "Grouping by region and summing revenue produces one sum per unique region â€” returned as a Series."
          },
          {
            q: "What is the default index of a new DataFrame?",
            options: ["Column names", "0, 1, 2, ...", "Random IDs", "No index"],
            answer: 1,
            explain: "By default, Pandas assigns a RangeIndex: 0, 1, 2, ..."
          },
          {
            q: "What does .agg(['sum', 'mean']) do?",
            options: ["Returns sum and mean as two columns", "Returns sum and mean as two rows", "Applies both functions and returns results for each", "Errors because you can only pass one function"],
            answer: 2,
            explain: ".agg() with a list applies each function and returns results in a table with one column per function."
          },
          {
            q: "What does pd.crosstab() count by default?",
            options: ["Sum of values", "Mean of values", "Frequency (counts)", "Unique values"],
            answer: 2,
            explain: "By default, crosstab counts how many times each combination appears (frequency table)."
          }
        ]
      }));

      root.appendChild(DS.doneToggle("pandas"));
      root.appendChild(DS.pageNav("pandas"));
    }
  });
})();

  <script>
(function () {
  "use strict";
  var el = DS.el;

  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];

  DS.registerTopic({
    id: "matplotlib",

    render: function (root) {
      root.appendChild(el("h1", { text: "ðŸ“ˆ Matplotlib" }));

      ));

      /* Figure Anatomy */
      root.appendChild(el("h2", { text: "Figure Anatomy" }));
      var showTitle = true, showAxLabels = true, showLegend = true, showMarkers = true, showGrid = true;
      var anatomyCanvas = el("canvas", { style: { height: "320px", width: "100%", background: "var(--bg-elev-2)", borderRadius: "var(--radius-sm)" } });

      function drawAnatomy() {

              type: "line",

              series: [
                { y: REV, label: "2023", markers: showMarkers },

            type: "line",

            series: [
              { y: REV, label: "2023", markers: showMarkers },
              { y: [10, 15, 18, 20, 26, 28], label: "2024", markers: showMarkers }
            ],
            xLabel: showAxLabels ? "Month" : undefined,

      function makeToggle(label, checked, desc, onChange) {

        return el("div", { style: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "6px" } },

        );

        makeToggle("Legend", true, "plt.legend()", function (v) { showLegend = v; }),
        makeToggle("Markers", true, "marker='o'", function (v) { showMarkers = v; }),
        makeToggle("Gridlines", true, "plt.grid(True)", function (v) { showGrid = v; })
      );

      root.appendChild(DS.widget("Figure Anatomy", "ðŸ”¬", "Interactive",
        anatomyCanvas, toggles
      ));

      /* Chart Builder */
      root.appendChild(el("h2", { text: "Chart Builder" }));
      var chartType = "line";
      var chartTitle = "Monthly Revenue";

      var chartYLabel = "Revenue ($k)";

      var swatches = el("div", { style: { display: "flex", gap: "6px" } });

      binsSlider.addEventListener("input", function () { binsVal.textContent = binsSlider.value; chartBins = parseInt(binsSlider.value); drawBuilder(); });
      binsControl = el("div", { class: "control", style: { display: "none" } }, el("label", { text: "Bins" }), binsSlider, binsVal);

      root.appendChild(DS.widget("Chart Builder", "ðŸŽ¨", "Interactive",
        el("div", { class: "controls" },
          el("div", { class: "control" }, el("label", { text: "Type" }), typeChips)
        ),
        el("div", { class: "controls" },
